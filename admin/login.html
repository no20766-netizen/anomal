
<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>관리자 로그인</title>
<link rel="stylesheet" href="/admin/assets/style.css"/>
</head><body>
<div class="main" style="max-width:420px;margin:80px auto">
  <div class="card">
    <h2>관리자 로그인</h2>
    <input id="id" class="input" placeholder="아이디"/>
    <input id="pw" class="input" type="password" placeholder="비밀번호"/>
    <button class="navbtn" onclick="login()">로그인</button>
    <div class="muted" id="msg"></div>
  </div>
</div>
<script>
async function login(){
  const id=document.getElementById('id').value.trim();
  const pw=document.getElementById('pw').value.trim();
  const res = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pw})});
  if(res.ok){ location.href='/admin/index.html'; } else { document.getElementById('msg').textContent='로그인 실패'; }
}
</script>
</body></html>
