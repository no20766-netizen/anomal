<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>로그인 | anomal</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#fff}
    .box{border:1px solid #e5e7eb;padding:24px;border-radius:12px;min-width:320px;background:#fff}
    button{height:44px;border:1px solid #111;background:#111;color:#fff;width:100%;cursor:pointer;margin-top:10px}
    .kakao{background:#fee500;color:#111;border-color:#fee500}
  </style>
</head>
<body>
  <div class="box">
    <h2 style="margin:0 0 12px">anomal 로그인</h2>
    <p style="color:#6b7280;margin:0 0 12px">소셜 계정으로 간편 로그인</p>
    <button id="btnGoogle">Google로 로그인</button>
    <button id="btnKakao" class="kakao">Kakao로 로그인</button>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const cfg = await (await fetch('/api/public-supabase')).json();
    const supa = createClient(cfg.url, cfg.anonKey);
    document.getElementById('btnGoogle').addEventListener('click', async ()=>{
      await supa.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + '/account.html' } });
    });
    document.getElementById('btnKakao').addEventListener('click', async ()=>{
      await supa.auth.signInWithOAuth({ provider:'kakao', options:{ redirectTo: location.origin + '/account.html' } });
    });
  </script>
</body>
</html>
