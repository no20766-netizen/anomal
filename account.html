<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>마이페이지 | anomal</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;margin:0;background:#fff}
    header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #e5e7eb}
    .wrap{max-width:960px;margin:0 auto;padding:20px}
    h2{margin:24px 0 12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    input{height:42px;border:1px solid #e5e7eb;padding:0 10px;width:100%}
    .btn{height:42px;border:1px solid #111;background:#111;color:#fff;padding:0 16px;cursor:pointer}
    .ghost{background:#fff;color:#111}
    details{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin:8px 0}
    summary{cursor:pointer;font-weight:600}
    table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
    th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left}
    .muted{color:#6b7280}
    .ziprow{display:grid;grid-template-columns:1fr auto;gap:8px}
  
.toast{position:fixed;top:20px;right:20px;background:#111;color:#fff;padding:10px 14px;font-size:12px;border-radius:6px;opacity:.98;z-index:9999;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.readonly input{background:#f8f9fb;color:#6b7280}

.auth-id,.authId,.user-id{display:none!important}
</style>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
<header><a id="homeLogoLink" href="/index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;"><img src="/img/logo-black.jpg" alt="anomal" style="height:28px;display:block"/></a></header>

  <header>
    <strong>마이페이지</strong>
    <div>
      <button id="btnLogout" class="btn ghost">로그아웃</button>
    </div>
  </header>
  <div class="wrap">
    <section>
      <h2>내 정보</h2>
      <div id="userBox" class="muted">확인 중…</div>
    </section>

    <section>
      <h2>기본 배송지</h2>
      <div class="grid">
        <input id="name" placeholder="수령인"/>
        <input id="phone" placeholder="연락처"/>
        <div class="ziprow">
          <input id="zipcode" placeholder="우편번호"/>
          <button id="btnZip" class="btn ghost" type="button">우편번호 찾기</button>
        </div>
        <input id="email" placeholder="이메일" />
        <input id="addr1" placeholder="주소" style="grid-column:1/3"/>
        <input id="addr2" placeholder="상세주소" style="grid-column:1/3"/>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <div style="display:flex;gap:8px"><button id="btnSave" class="btn">저장</button><button id="btnEdit" class="btn ghost" type="button" style="display:none">수정</button></div>
        <span id="saveMsg" class="muted"></span>
      </div>
    </section>

    <section>
      <h2>구매내역</h2>
      <div id="orders"></div>
    </section>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const cfg = await (await fetch('/api/public-supabase')).json();
    const supa = createClient(cfg.url, cfg.anonKey);
    const $ = s => document.querySelector(s);

    // 세션 확인
    const { data: { session } } = await supa.auth.getSession();
    if(!session){ location.href = '/login.html'; throw new Error('no-session'); }
    const user = session.user;
    $('#userBox').innerHTML = `<div><strong>${user.email || ''}</strong><div class="muted"></div></div>`;

    
    function toast(msg){
      const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
      document.body.appendChild(t); setTimeout(()=>{ t.remove(); }, 1800);
    }
    function setReadOnly(ro){
      const fields = ['name','phone','zipcode','addr1','addr2','email'];
      fields.forEach(id=>{ const el=document.getElementById(id); if(!el) return; el.readOnly=ro; });
      const form = document.getElementById('addrForm'); if(form){ form.classList.toggle('readonly', ro); }
      document.getElementById('btnZip')?.toggleAttribute('disabled', ro);
      document.getElementById('btnSave').style.display = ro ? 'none' : '';
      document.getElementById('btnEdit').style.display = ro ? '' : 'none';
    }
    function requireField(id, label){
      const v = (document.getElementById(id)?.value||'').trim();
      if(!v){ toast(label + '을(를) 입력해주세요.'); document.getElementById(id)?.focus(); return false; }
      return true;
    }

    // 우편번호
    document.getElementById('btnZip').addEventListener('click', ()=>{
      new daum.Postcode({
        oncomplete: function(data){
          const zone = data.zonecode || '';
          const addr = (data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress) || '';
          document.getElementById('zipcode').value = zone;
          document.getElementById('addr1').value = addr;
          document.getElementById('addr2').focus();
        }
      }).open();
    });

    // 배송지 불러오기
    async function loadAddress(){
      const q = new URLSearchParams({ authUserId: user.id });
      const r = await fetch('/api/profile/default?'+q.toString());
      if(!r.ok) return;
      const j = await r.json();
      if(j.customer){ $('#email').value = j.customer.email || user.email || ''; }
      if(j.address){
        $('#name').value = j.address.recipient || '';
        $('#phone').value = j.address.phone || '';
        $('#zipcode').value = j.address.zipcode || '';
        $('#addr1').value = j.address.addr1 || '';
        $('#addr2').value = j.address.addr2 || '';
      }
    }
    await loadAddress();
    // 초기에는 저장 전 상태(편집 가능)
    setReadOnly(false);
    document.getElementById('btnEdit').addEventListener('click', ()=> setReadOnly(false));

    // 저장
    $('#btnSave').addEventListener('click', async ()=>{
      if(!requireField('name','수령인')) return;
      if(!requireField('phone','연락처')) return;
      if(!requireField('zipcode','우편번호')) return;
      if(!requireField('addr1','주소')) return;
      if(!requireField('addr2','상세주소')) return;
      if(!requireField('email','이메일')) return;
      const body = {
        authUserId: user.id,
        email: $('#email').value.trim() || user.email,
        name: $('#name').value.trim(),
        phone: $('#phone').value.trim(),
        zipcode: $('#zipcode').value.trim(),
        addr1: $('#addr1').value.trim(),
        addr2: $('#addr2').value.trim()
      };
      const r = await fetch('/api/profile/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      $('#saveMsg').textContent = r.ok ? '저장되었습니다.' : '저장 실패';
      if(r.ok){ await loadAddress(); setReadOnly(true); toast('저장되었습니다.'); } else { toast('저장 실패'); }
    });

    // 구매내역
    async function loadOrders(){
      const q = new URLSearchParams({ authUserId: user.id });
      const r = await fetch('/api/me/orders?'+q.toString());
      if(!r.ok){ $('#orders').innerHTML = '<p class="muted">주문 내역을 불러오지 못했습니다.</p>'; return; }
      const j = await r.json();
      if(!j.orders || !j.orders.length){ $('#orders').innerHTML = '<p class="muted">구매내역이 없습니다.</p>'; return; }
      $('#orders').innerHTML = j.orders.map(o=>{
        const items = (o.items||[]).map(it=>`<tr><td>${it.name}</td><td>${it.qty}</td><td>${(it.price||0).toLocaleString('ko-KR')}</td></tr>`).join('');
        const pays = (o.payments||[]).map(p=>`<div class="muted">TID: ${p.tid} / ${p.status} ${p.receipt_url ? ' — <a href="'+p.receipt_url+'" target="_blank">영수증</a>' : ''}</div>`).join('');
        return `
          <details>
            <summary>주문 ${o.order_id} — ${o.status} — ₩${(o.total_amount||0).toLocaleString('ko-KR')} — ${new Date(o.created_at).toLocaleString('ko-KR')}</summary>
            <div style="margin-top:6px">
              <table><thead><tr><th>상품</th><th>수량</th><th>금액</th></tr></thead><tbody>${items}</tbody></table>
              <div style="margin-top:6px">${pays}</div>
            </div>
          </details>`;
      }).join('');
    }
    await loadOrders();

    // 로그아웃
    document.getElementById('btnLogout').addEventListener('click', async ()=>{
      await supa.auth.signOut();
      location.href = '/login.html';
    });
  </script>
</body>
</html>
