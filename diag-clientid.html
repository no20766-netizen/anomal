<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NICEPAY clientId 점검</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:2rem}</style>
</head>
<body>
  <h1>clientId/모드 점검</h1>
  <pre id="out">loading...</pre>
  <script>
    fetch('/api/nicepay/public-config').then(r=>r.json()).then(j=>{
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
    }).catch(e=>{
      document.getElementById('out').textContent = '에러: '+e;
    });
  </script>
</body>
</html>
